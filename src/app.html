<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis temas">
<meta name="theme-color" content="#0e0f12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mis temas</title>
<style>
  :root {
    --bg: #0e0f12;
    --surface: #17191e;
    --surface-2: #20232a;
    --line: #2c3038;
    --text: #f2f3f5;
    --muted: #8b919c;
    --accent: #ffb547;
    --accent-ink: #1a1203;
    --warn: #ff7a6b;
    --note: #ffffff;
    --scale: 1;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size: calc(17px * var(--scale));
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

  /* ---------- Home ---------- */
  .home-head { padding: 36px 0 20px; display: flex; align-items: end; justify-content: space-between; gap: 16px; }
  .home-head h1 { margin: 0; font-size: 2.1em; letter-spacing: -0.02em; }
  .home-head p { margin: 4px 0 0; color: var(--muted); }
  .song-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; padding-bottom: 40px; }
  .song-card {
    display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    padding: 20px 22px; transition: transform .12s, border-color .12s;
  }
  .song-card:active { transform: scale(.98); }
  .song-card:hover { border-color: #3c414b; }
  .song-card__title { font-size: 1.3em; font-weight: 700; letter-spacing: -0.01em; }
  .song-card__artist { color: var(--muted); margin-top: 2px; }
  .song-card__meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }

  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px;
    background: var(--surface-2); color: var(--muted); font-size: .8em; font-weight: 600; white-space: nowrap;
  }
  .chip b { color: var(--text); font-weight: 700; }
  .chip--warn { background: rgba(255,122,107,.14); color: var(--warn); }
  .chip--warn b { color: var(--warn); }

  /* ---------- Song ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10; background: rgba(14,15,18,.92);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top);
    margin-top: calc(-1 * env(safe-area-inset-top));
  }
  .topbar__row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .icon-btn {
    min-width: 44px; height: 44px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface-2); font-weight: 700; font-size: 1em; padding: 0 12px;
  }
  .icon-btn:active { filter: brightness(1.3); }
  .icon-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .topbar__title { flex: 1; min-width: 0; }
  .topbar__title h1 { margin: 0; font-size: 1.25em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar__title div { color: var(--muted); font-size: .85em; }
  .topbar__tools { display: flex; gap: 6px; }

  .structure { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0 12px; }
  .structure button {
    padding: 8px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line);
    font-size: .85em; font-weight: 600; color: var(--muted); min-height: 40px;
  }
  .structure button .x { color: var(--accent); margin-left: 2px; }
  .structure button.is-current { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .structure button.is-current .x { color: var(--accent-ink); }
  .structure button.is-done { opacity: .45; }

  .song-meta { display: flex; flex-wrap: wrap; gap: 8px; padding: 20px 0 6px; }
  .song-meta .chip { font-size: .9em; padding: 6px 12px; }

  .sections { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); gap: 14px; padding: 14px 0 140px; }
  .section {
    background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px 20px 18px;
    scroll-margin-top: 170px; transition: border-color .15s, background .15s;
  }
  .section.is-current { border-color: var(--accent); background: #1d1a14; }
  .section__head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .section__name { font-size: 1.05em; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  .section__repeat { font-weight: 800; font-size: 1.1em; color: var(--text); background: var(--surface-2); border-radius: 8px; padding: 2px 10px; }
  .line {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 1.55em; line-height: 1.6;
    display: flex; flex-wrap: wrap; column-gap: .5em; row-gap: 0;
  }
  .line + .line { margin-top: 4px; }
  .n { color: var(--note); font-weight: 700; }
  .n sup { font-size: .6em; margin-left: 1px; }
  .bar { color: #4a505b; font-weight: 400; }
  .rest { color: #5b616c; }
  .ghost .n { color: var(--muted); font-weight: 500; }
  .times { color: var(--accent); font-family: -apple-system, sans-serif; font-weight: 800; font-size: .75em; align-self: center; }
  .link { margin: 0 .12em; }
  .tok { color: var(--muted); font-size: .7em; align-self: center; font-family: -apple-system, sans-serif; font-weight: 600; }
  .hint { margin-top: 10px; color: #d9c9ad; font-size: .95em; }
  .hint::before { content: "→ "; color: var(--accent); }

  .stepper {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(14,15,18,.94); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-top: 1px solid var(--line); padding: 10px 20px calc(10px + env(safe-area-inset-bottom));
  }
  .stepper__row { max-width: 1100px; margin: 0 auto; display: flex; gap: 10px; align-items: stretch; }
  .stepper button { border-radius: 14px; background: var(--surface-2); font-weight: 700; min-height: 60px; padding: 0 22px; }
  .stepper button:active { filter: brightness(1.3); }
  .stepper .next { background: var(--accent); color: var(--accent-ink); flex: 0 0 auto; min-width: 150px; }
  .stepper .now { flex: 1; text-align: left; padding: 0 18px; min-width: 0; }
  .stepper .now small { display: block; color: var(--muted); font-weight: 600; font-size: .75em; }
  .stepper .now span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 1.1em; }

  .notice { color: var(--muted); font-size: .85em; padding: 0 0 30px; }
  @media (max-width: 600px) {
    .wrap { padding: 0 16px; }
    .line { font-size: 1.3em; }
    .stepper .next { min-width: 110px; }
    .topbar__tools .hide-sm { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const SONGS = /*SONGS*/[];

const $ = (s, el = document) => el.querySelector(s);
const app = $('#app');

// ---------- Preferences (per device) ----------
const prefs = (() => {
  let p = {};
  try { p = JSON.parse(localStorage.getItem('prefs') || '{}'); } catch {}
  return {
    get: (k, d) => (k in p ? p[k] : d),
    set: (k, v) => { p[k] = v; try { localStorage.setItem('prefs', JSON.stringify(p)); } catch {} },
  };
})();
function applyScale() { document.documentElement.style.setProperty('--scale', prefs.get('scale', 1)); }
applyScale();

// ---------- Note rendering ----------
const SOLFEO = { C: 'Do', D: 'Re', E: 'Mi', F: 'Fa', G: 'Sol', A: 'La', B: 'Si' };
const NOTE_RE = /^([A-G])([#b♯♭]?)(\d*)$/;

function noteHTML(tok) {
  const m = tok.match(NOTE_RE);
  if (!m) return null;
  const name = prefs.get('solfeo', false) ? SOLFEO[m[1]] : m[1];
  const acc = m[2] === '#' || m[2] === '♯' ? '♯' : m[2] ? '♭' : '';
  return `<span class="n">${name}${acc}${m[3] ? `<sup>${m[3]}</sup>` : ''}</span>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function tokenHTML(t) {
  if (t === '|') return '<span class="bar">|</span>';
  if (/^\.+$/.test(t)) return `<span class="rest">${'·'.repeat(t.length)}</span>`;
  if (/^x$/i.test(t)) return '<span class="rest">×</span>';
  // (A) = ghost/pedal note
  const ghost = t.match(/^\((.+)\)$/);
  if (ghost && NOTE_RE.test(ghost[1])) return `<span class="ghost">${noteHTML(ghost[1])}</span>`;
  // E-A-B = ligado (hammer/pull), C~D = slide, E~ = deja sonar
  const parts = t.split(/([-~])/);
  if (parts.length > 1 && parts.every((x, i) => i % 2 ? true : x === '' || NOTE_RE.test(x))) {
    return `<span>${parts.map((x, i) => i % 2 ? `<span class="rest link">${x === "~" ? "~" : "–"}</span>` : x && noteHTML(x)).join('')}</span>`;
  }
  return noteHTML(t) || `<span class="tok">${esc(t)}</span>`;
}
function lineHTML(line) {
  // "(×3)" style counters stick together as one label
  return line.trim().replace(/\(\s*[x×]\s*(\d+)\s*\)/gi, '[×$1]').split(/\s+/)
    .map(t => /^\[×\d+\]$/.test(t) ? `<span class="times">${t.slice(1, -1)}</span>` : tokenHTML(t)).join(' ');
}

const isStandard = t => !t || /^est[aá]ndar/i.test(t);

function metaChips(s, big) {
  const chips = [];
  if (s.key) chips.push(`<span class="chip">Tono <b>${esc(s.key)}</b></span>`);
  if (s.bpm) chips.push(`<span class="chip"><b>${esc(s.bpm)}</b> BPM</span>`);
  if (s.tuning) chips.push(`<span class="chip ${isStandard(s.tuning) ? '' : 'chip--warn'}">Afinación <b>${esc(big ? s.tuning : s.tuning.split('(')[0].trim())}</b></span>`);
  return chips.join('');
}

// ---------- Screen wake lock ----------
let wakeLock = null;
async function setWake(on) {
  try {
    if (on && 'wakeLock' in navigator) {
      if (!wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    } else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && currentSong && prefs.get('awake', true)) setWake(true);
});

// ---------- Views ----------
let currentSong = null, step = 0;

function renderHome() {
  currentSong = null; setWake(false);
  document.title = 'Mis temas';
  app.innerHTML = `
    <div class="wrap">
      <header class="home-head">
        <div><h1>Mis temas</h1><p>${SONGS.length} temas para el bajo</p></div>
      </header>
      <div class="song-list">
        ${SONGS.map(s => `
          <a class="song-card" href="#/${s.slug}">
            <div class="song-card__title">${esc(s.title)}</div>
            <div class="song-card__artist">${esc(s.artist)}</div>
            <div class="song-card__meta">${metaChips(s, false)}</div>
          </a>`).join('')}
      </div>
    </div>`;
  window.scrollTo(0, 0);
}

function renderSong(song) {
  currentSong = song;
  document.title = `${song.title} · Mis temas`;
  const byId = Object.fromEntries(song.sections.map(s => [s.id, s]));
  const awake = prefs.get('awake', true);
  step = Math.min(prefs.get('step:' + song.slug, 0), song.structure.length - 1);

  app.innerHTML = `
    <header class="topbar">
      <div class="wrap">
        <div class="topbar__row">
          <a class="icon-btn" href="#/" aria-label="Volver a la lista">‹ Temas</a>
          <div class="topbar__title"><h1>${esc(song.title)}</h1><div>${esc(song.artist)}</div></div>
          <div class="topbar__tools">
            <button class="icon-btn" data-act="smaller" aria-label="Letra más pequeña">A−</button>
            <button class="icon-btn" data-act="bigger" aria-label="Letra más grande">A+</button>
            <button class="icon-btn hide-sm" data-act="solfeo" aria-pressed="${prefs.get('solfeo', false)}" title="Cambiar notación">Do Re</button>
            <button class="icon-btn" data-act="awake" aria-pressed="${awake}" title="Mantener la pantalla encendida">☀︎</button>
          </div>
        </div>
        <nav class="structure" aria-label="Estructura">
          ${song.structure.map((st, i) => `
            <button data-step="${i}">${esc(byId[st.id]?.name || st.id)}${st.repeat > 1 ? `<span class="x"> ×${st.repeat}</span>` : ''}</button>`).join('')}
        </nav>
      </div>
    </header>
    <main class="wrap">
      <div class="song-meta">${metaChips(song, true)}</div>
      <div class="sections">
        ${song.sections.map(sec => `
          <section class="section" id="sec-${sec.id}">
            <div class="section__head">
              <div class="section__name">${esc(sec.name)}</div>
              ${sec.repeat > 1 ? `<div class="section__repeat">×${sec.repeat}</div>` : ''}
            </div>
            ${sec.lines.map(l => `<div class="line">${lineHTML(l)}</div>`).join('')}
            ${sec.hint ? `<div class="hint">${esc(sec.hint)}</div>` : ''}
          </section>`).join('')}
      </div>
      ${song.notes ? `<p class="notice">${esc(song.notes)}</p>` : ''}
    </main>
    <footer class="stepper">
      <div class="stepper__row">
        <button class="prev" data-act="prev" aria-label="Parte anterior">‹</button>
        <button class="now" data-act="now"><small></small><span></span></button>
        <button class="next" data-act="next">Siguiente ›</button>
      </div>
    </footer>`;

  app.onclick = e => {
    const b = e.target.closest('[data-act],[data-step]');
    if (!b) return;
    if (b.dataset.step) return goStep(+b.dataset.step, true);
    const act = b.dataset.act;
    if (act === 'next') goStep(step + 1, true);
    else if (act === 'prev') goStep(step - 1, true);
    else if (act === 'now') goStep(step, true);
    else if (act === 'bigger' || act === 'smaller') {
      const v = Math.round(Math.min(1.8, Math.max(0.7, prefs.get('scale', 1) + (act === 'bigger' ? 0.1 : -0.1))) * 10) / 10;
      prefs.set('scale', v); applyScale();
    } else if (act === 'solfeo') {
      prefs.set('solfeo', !prefs.get('solfeo', false)); renderSong(song);
    } else if (act === 'awake') {
      const on = !prefs.get('awake', true); prefs.set('awake', on); b.setAttribute('aria-pressed', on); setWake(on);
    }
  };

  window.scrollTo(0, 0);
  goStep(step, false);
  if (awake) setWake(true);
}

function goStep(i, scroll) {
  const song = currentSong;
  if (!song) return;
  step = Math.max(0, Math.min(song.structure.length - 1, i));
  prefs.set('step:' + song.slug, step);
  const st = song.structure[step];
  const sec = song.sections.find(s => s.id === st.id);

  document.querySelectorAll('.structure button').forEach((b, j) => {
    b.classList.toggle('is-current', j === step);
    b.classList.toggle('is-done', j < step);
  });
  document.querySelectorAll('.section').forEach(el => el.classList.toggle('is-current', el.id === 'sec-' + st.id));

  $('.stepper .now small').textContent = `Parte ${step + 1} de ${song.structure.length}`;
  $('.stepper .now span').textContent = (sec?.name || st.id) + (st.repeat > 1 ? ` ×${st.repeat}` : '');
  const nextSt = song.structure[step + 1];
  $('.stepper .next').textContent = nextSt ? 'Siguiente ›' : 'Fin';
  $('.stepper .next').disabled = !nextSt;
  $('.stepper .prev').disabled = step === 0;

  if (scroll) {
    document.getElementById('sec-' + st.id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.querySelector('.structure .is-current')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
}

// Keyboard and Bluetooth page-turner pedals (they send arrow keys / space / page down)
document.addEventListener('keydown', e => {
  if (!currentSong) return;
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); goStep(step + 1, true); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); goStep(step - 1, true); }
  else if (e.key === 'Escape') location.hash = '#/';
});

// ---------- Router ----------
function route() {
  const slug = location.hash.replace(/^#\/?/, '');
  const song = SONGS.find(s => s.slug === slug);
  song ? renderSong(song) : renderHome();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
