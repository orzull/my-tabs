<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis temas">
<meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14151b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mis temas</title>
<style>
  :root {
    --bg: #faf7f2;
    --surface: #ffffff;
    --surface-2: #f1ede6;
    --line: #e8e2d8;
    --text: #1d1b22;
    --muted: #7a7480;
    --soft: #b9b2bd;
    --shadow: 0 1px 2px rgba(40, 30, 20, .06), 0 4px 14px rgba(40, 30, 20, .06);
    --warn: #e5484d;
    /* sunburst: el naranja tostado de un Precision de los 90 */
    --accent: #d2601a;
    --accent-deep: #6e2c0e;
    --accent-light: #f0a23b;
    --tint: 11%;
    --scale: 1;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14151b; --surface: #1d1f27; --surface-2: #272a34; --line: #2e313c;
      --text: #f4f3f7; --muted: #9a98a6; --soft: #5d5f6c;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
      --warn: #ff6b6f;
      --accent: #ff8a3d; --accent-deep: #c2410c; --accent-light: #ffc46b;
      --tint: 15%;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14151b; --surface: #1d1f27; --surface-2: #272a34; --line: #2e313c;
    --text: #f4f3f7; --muted: #9a98a6; --soft: #5d5f6c;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    --warn: #ff6b6f;
    --accent: #ff8a3d; --accent-deep: #c2410c; --accent-light: #ffc46b;
    --tint: 15%;
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Helvetica Neue", Arial, sans-serif;
    font-size: calc(16px * var(--scale));
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 16px; }

  .icon-btn {
    min-width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
    font-weight: 700; font-size: .95em; padding: 0 11px; white-space: nowrap;
  }
  .icon-btn:active { transform: scale(.95); }
  .icon-btn[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px;
    background: var(--surface-2); color: var(--muted); font-size: .8em; font-weight: 600; white-space: nowrap;
  }
  .chip b { color: var(--text); font-weight: 800; }
  .chip--warn { background: color-mix(in srgb, var(--warn) var(--tint), transparent); color: var(--warn); }
  .chip--warn b { color: var(--warn); }

  [data-kind] { --c: var(--accent); }

  /* ---------- Home ---------- */
  .home-head { max-width: 900px; padding: 34px 0 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .home-head h1 {
    margin: 0; font-size: 2.6em; font-weight: 900; letter-spacing: -0.03em;
    background: linear-gradient(90deg, var(--accent-deep), var(--accent) 50%, var(--accent-light));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .home-head p { margin: 2px 0 0; color: var(--muted); font-weight: 600; }
  .song-list { display: grid; grid-template-columns: 1fr; gap: 10px; padding-bottom: 40px; max-width: 900px; }
  .song-card {
    position: relative; overflow: hidden; display: block; background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 14px 18px; box-shadow: var(--shadow); transition: transform .12s;
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 14px;
  }
  .song-card:active { transform: scale(.98); }
  .song-card__num {
    width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-weight: 900; color: #fff;
    background: linear-gradient(135deg, var(--accent-deep), var(--accent) 60%, var(--accent-light)); grid-row: span 2;
  }
  .song-card__title { font-size: 1.2em; align-self: end; font-weight: 800; letter-spacing: -0.01em; }
  .song-card__artist { color: var(--muted); font-weight: 600; align-self: start; grid-column: 2; }
  .song-card__meta { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; grid-column: 3; grid-row: 1 / span 2; }
  .song-card__parts { grid-column: 1 / -1; }
  @media (max-width: 700px) { .song-card__meta { grid-column: 2; grid-row: auto; justify-content: flex-start; margin-top: 8px; } }
  .song-card__parts { display: flex; gap: 3px; margin-top: 12px; height: 5px; }
  .song-card__parts i { flex: 1; border-radius: 3px; background: var(--line); }
  .song-card__parts i[data-kind="estribillo"] { background: var(--accent); }

  /* ---------- Song ---------- */
  .song-head { display: flex; align-items: center; gap: 12px; padding: 12px 0 8px; flex-wrap: wrap; }
  .song-head__title { flex: 1; min-width: 200px; }
  .song-head__title h1 { margin: 0; font-size: 1.45em; font-weight: 900; letter-spacing: -0.02em; line-height: 1.15; }
  .song-head__title span { color: var(--muted); font-weight: 600; font-size: .9em; }
  .song-head__meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .tools { display: flex; gap: 6px; }

  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 2px; padding: 0 0 12px; font-size: .82em; font-weight: 700; }
  .flow span { color: var(--muted); white-space: nowrap; }
  .flow span[data-kind="estribillo"] { color: var(--accent); }
  .flow span i { font-style: normal; opacity: .7; }
  .flow b { color: var(--soft); font-weight: 600; margin: 0 4px; }

  .sections { display: grid; grid-template-columns: 1fr; gap: 10px; padding-bottom: 30px; }
  .section {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px 12px;
    box-shadow: var(--shadow);
  }
  .section__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .section__name { font-size: .78em; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: var(--c); }
  .section__repeat {
    font-weight: 900; font-size: .95em; color: var(--c); border-radius: 8px; padding: 1px 9px;
    background: color-mix(in srgb, var(--c) var(--tint), transparent);
  }
  .line { font-size: 1.4em; line-height: 1.5; display: flex; flex-wrap: wrap; column-gap: .42em; }
  .n { font-weight: 800; letter-spacing: -0.01em; }
  .n sup { font-size: .6em; margin-left: 1px; }
  .bar { color: var(--soft); font-weight: 400; }
  .rest { color: var(--soft); font-weight: 700; }
  .link { margin: 0 .1em; }
  .ghost .n { color: var(--muted); font-weight: 500; }
  .times { color: var(--c); font-weight: 900; font-size: .72em; align-self: center; }
  .tok { color: var(--muted); font-size: .7em; align-self: center; font-weight: 600; }
  .hint { margin-top: 6px; color: var(--muted); font-size: .85em; font-weight: 500; }

  .seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
  .seg button { padding: 0 12px; height: 32px; border-radius: 9px; font-weight: 700; font-size: .85em; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
  .tuning-note {
    margin: 0 0 10px; padding: 8px 12px; border-radius: 12px; font-size: .85em; font-weight: 600;
    background: color-mix(in srgb, var(--accent) var(--tint), transparent); color: var(--text);
  }
  .tuning-note b { color: var(--accent); }

  @media (max-width: 600px) {
    .home-head h1 { font-size: 2.1em; }
    .line { font-size: 1.25em; }
    .tools .hide-sm { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const SONGS = /*SONGS*/[];

const $ = (s, el = document) => el.querySelector(s);
const app = $('#app');

// ---------- Preferences (per device) ----------
const prefs = (() => {
  let p = {};
  try { p = JSON.parse(localStorage.getItem('prefs') || '{}'); } catch {}
  return {
    get: (k, d) => (k in p ? p[k] : d),
    set: (k, v) => { p[k] = v; try { localStorage.setItem('prefs', JSON.stringify(p)); } catch {} },
  };
})();
function applyPrefs() {
  document.documentElement.style.setProperty('--scale', prefs.get('scale', 1));
  const theme = prefs.get('theme', 'auto');
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
}
applyPrefs();

const THEMES = { auto: ['◐', 'Tema automático'], light: ['☀︎', 'Tema claro'], dark: ['☾', 'Tema oscuro'] };
const NEXT_THEME = { auto: 'light', light: 'dark', dark: 'auto' };
function themeButton() {
  const [icon, label] = THEMES[prefs.get('theme', 'auto')];
  return `<button class="icon-btn" data-act="theme" title="${label}" aria-label="${label}">${icon}</button>`;
}

// ---------- Section kinds → colour ----------
function kindOf(sec) {
  const s = (sec.id + ' ' + sec.name).toLowerCase();
  if (/pre/.test(s)) return 'pre';
  if (/estribillo|coro/.test(s)) return 'estribillo';
  if (/intro/.test(s)) return 'intro';
  if (/verso|estrofa/.test(s)) return 'verso';
  if (/puente/.test(s)) return 'puente';
  if (/solo/.test(s)) return 'solo';
  if (/outro|final|cierre/.test(s)) return 'outro';
  return 'riff';
}

// ---------- Note rendering ----------
const SOLFEO = { C: 'Do', D: 'Re', E: 'Mi', F: 'Fa', G: 'Sol', A: 'La', B: 'Si' };
const NOTE_RE = /^([A-G])([#b♯♭]?)(\d*)$/;

// Semitones to add to the written notes (≠ 0 when showing a down-tuned song for standard tuning)
let shift = 0;
const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const SHARPS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const FLATS = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
function transposeNote(letter, acc, n) {
  if (!n) return [letter, acc];
  const v = (SEMI[letter] + (/[#♯]/.test(acc) ? 1 : acc ? -1 : 0) + n + 120) % 12;
  const name = (n < 0 ? FLATS : SHARPS)[v];
  return [name[0], name.slice(1)];
}
// Transposes note names inside free text (keys like "Em", hints like "pedal en E")
function transposeText(s) {
  if (!shift) return s;
  return s.replace(/\b([A-G])([#♯b♭]?)(?=m\b|[^\wáéíóúñ]|$)/g, (_, l, a) => transposeNote(l, a, shift).join(''));
}

function noteHTML(tok) {
  const m = tok.match(NOTE_RE);
  if (!m) return null;
  const [letter, accRaw] = transposeNote(m[1], m[2], shift);
  const name = prefs.get('solfeo', false) ? SOLFEO[letter] : letter;
  const acc = accRaw === '#' || accRaw === '♯' ? '♯' : accRaw ? '♭' : '';
  return `<span class="n">${name}${acc}${m[3] ? `<sup>${m[3]}</sup>` : ''}</span>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function tokenHTML(t) {
  if (t === '|') return '<span class="bar">|</span>';
  if (/^\.+$/.test(t)) return `<span class="rest">${'·'.repeat(t.length)}</span>`;
  if (/^x$/i.test(t)) return '<span class="rest">×</span>';
  // (A) = ghost/pedal note
  const ghost = t.match(/^\((.+)\)$/);
  if (ghost && NOTE_RE.test(ghost[1])) return `<span class="ghost">${noteHTML(ghost[1])}</span>`;
  // E-A-B = ligado (hammer/pull), C~D = slide, E~ = deja sonar
  const parts = t.split(/([-~])/);
  if (parts.length > 1 && parts.every((x, i) => i % 2 ? true : x === '' || NOTE_RE.test(x))) {
    return `<span>${parts.map((x, i) => i % 2 ? `<span class="rest link">${x === '~' ? '~' : '–'}</span>` : x && noteHTML(x)).join('')}</span>`;
  }
  return noteHTML(t) || `<span class="tok">${esc(t)}</span>`;
}
function lineHTML(line) {
  // "(×3)" style counters stick together as one label
  return line.trim().replace(/\(\s*[x×]\s*(\d+)\s*\)/gi, '[×$1]').split(/\s+/)
    .map(t => /^\[×\d+\]$/.test(t) ? `<span class="times">${t.slice(1, -1)}</span>` : tokenHTML(t)).join(' ');
}

const isStandard = t => !t || /^est[aá]ndar/i.test(t);

function metaChips(s, full) {
  const chips = [];
  if (s.key) chips.push(`<span class="chip">Tono <b>${esc(transposeText(s.key))}</b></span>`);
  if (s.bpm) chips.push(`<span class="chip"><b>${esc(s.bpm)}</b> BPM</span>`);
  if (full && !isStandard(s.tuning) && prefs.get('tuningMode', 'original') === 'standard') chips.push(`<span class="chip">Afinación <b>Estándar</b></span>`);
  else if (s.tuning) chips.push(`<span class="chip ${isStandard(s.tuning) ? '' : 'chip--warn'}">Afinación <b>${esc(full ? s.tuning : s.tuning.split(/[(—]/)[0].trim())}</b></span>`);
  return chips.join('');
}

// ---------- Screen wake lock ----------
let wakeLock = null, onSong = false;
async function setWake(on) {
  try {
    if (on && 'wakeLock' in navigator) {
      if (!wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    } else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && onSong) setWake(true);
});

// ---------- Views ----------
function renderHome() {
  onSong = false; setWake(false); shift = 0;
  document.title = 'Mis temas';
  const kinds = ['estribillo', 'verso', 'puente', 'intro', 'pre', 'solo', 'riff'];
  app.innerHTML = `
    <div class="wrap">
      <header class="home-head">
        <div><h1>Mis temas</h1><p>${SONGS.length} temas para el bajo</p></div>
        <div class="tools">${themeButton()}</div>
      </header>
      <div class="song-list">
        ${SONGS.map((s, i) => `
          <a class="song-card" href="#/${s.slug}">
            <div class="song-card__num" data-kind="${kinds[i % kinds.length]}">${i + 1}</div>
            <div class="song-card__title">${esc(s.title)}</div>
            <div class="song-card__artist">${esc(s.artist)}</div>
            <div class="song-card__meta">${metaChips(s, false)}</div>
            <div class="song-card__parts" aria-hidden="true">
              ${s.structure.map(st => `<i data-kind="${kindOf(s.sections.find(x => x.id === st.id))}"></i>`).join('')}
            </div>
          </a>`).join('')}
      </div>
    </div>`;
  window.scrollTo(0, 0);
}

function renderSong(song) {
  onSong = true;
  document.title = `${song.title} · Mis temas`;
  const byId = Object.fromEntries(song.sections.map(s => [s.id, s]));
  const altTuning = !isStandard(song.tuning);
  const toStandard = altTuning && prefs.get('tuningMode', 'original') === 'standard';
  shift = toStandard ? (song.transpose || 0) : 0;
  const tuningName = (song.tuning || '').split(/[(—]/)[0].trim();
  const tuningNote = !altTuning ? ''
    : toStandard
      ? `Notas para tocar en <b>afinación estándar</b> (el disco está en ${esc(tuningName)}).${song.standardNote ? ' ' + esc(song.standardNote) : ''}`
      : `Notas para tocar con el bajo en <b>${esc(tuningName)}</b>, como en el disco.${song.originalNote ? ' ' + esc(song.originalNote) : ''}`;

  app.innerHTML = `
    <div class="wrap">
      <header class="song-head">
        <a class="icon-btn" href="#/" aria-label="Volver a la lista">‹ Temas</a>
        <div class="song-head__title"><h1>${esc(song.title)}</h1><span>${esc(song.artist)}</span></div>
        <div class="song-head__meta">${metaChips(song, true)}</div>
        <div class="tools">
          ${altTuning ? `<div class="seg" role="group" aria-label="Afinación de las notas">
            <button data-act="tuning" data-mode="original" aria-pressed="${!toStandard}">Original</button>
            <button data-act="tuning" data-mode="standard" aria-pressed="${toStandard}">Estándar</button>
          </div>` : ''}
          <button class="icon-btn" data-act="smaller" aria-label="Letra más pequeña">A−</button>
          <button class="icon-btn" data-act="bigger" aria-label="Letra más grande">A+</button>
          <button class="icon-btn hide-sm" data-act="solfeo" aria-pressed="${prefs.get('solfeo', false)}" title="Cambiar notación">Do Re</button>
          ${themeButton()}
        </div>
      </header>
      <div class="flow" aria-label="Estructura">
        ${song.structure.map(st => {
          const sec = byId[st.id];
          return `<span data-kind="${kindOf(sec)}">${esc(sec.name)}${st.repeat > 1 ? `<i> ×${st.repeat}</i>` : ''}</span>`;
        }).join('<b>›</b>')}
      </div>
      ${tuningNote ? `<p class="tuning-note">${tuningNote}</p>` : ''}
      <main class="sections">
        ${song.sections.map(sec => `
          <section class="section" data-kind="${kindOf(sec)}">
            <div class="section__head">
              <div class="section__name">${esc(sec.name)}</div>
              ${sec.repeat > 1 ? `<div class="section__repeat">×${sec.repeat}</div>` : ''}
            </div>
            ${sec.lines.map(l => `<div class="line">${lineHTML(l)}</div>`).join('')}
            ${sec.hint ? `<div class="hint">${esc(transposeText(sec.hint))}</div>` : ''}
          </section>`).join('')}
      </main>
    </div>`;

  window.scrollTo(0, 0);
  setWake(true); // keep the iPad from locking while a song is open
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'bigger' || act === 'smaller') {
    const v = Math.round(Math.min(1.8, Math.max(0.7, prefs.get('scale', 1) + (act === 'bigger' ? 0.1 : -0.1))) * 10) / 10;
    prefs.set('scale', v); applyPrefs();
  } else if (act === 'theme') {
    prefs.set('theme', NEXT_THEME[prefs.get('theme', 'auto')]); applyPrefs();
    b.outerHTML = themeButton();
  } else if (act === 'tuning') {
    const y = window.scrollY; prefs.set('tuningMode', b.dataset.mode); route(); window.scrollTo(0, y);
  } else if (act === 'solfeo') {
    prefs.set('solfeo', !prefs.get('solfeo', false)); route();
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && onSong) location.hash = '#/'; });

// ---------- Router ----------
function route() {
  const slug = location.hash.replace(/^#\/?/, '');
  const song = SONGS.find(s => s.slug === slug);
  song ? renderSong(song) : renderHome();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
