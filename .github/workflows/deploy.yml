name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: node build.mjs

      - name: Encrypt with SITE_PASSWORD
        env:
          STATICRYPT_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then echo "::error::Falta el secret SITE_PASSWORD"; exit 1; fi
          cd build
          npx -y staticrypt@3.5.4 index.html -c ../.staticrypt.json -d ../dist -t ../src/lock.html --short --remember 365 \
            --template-title "Mis temas" --template-instructions "Introduce la contraseña" \
            --template-placeholder "Contraseña" --template-button "Entrar" \
            --template-remember "Recordarme en este dispositivo" --template-error "Contraseña incorrecta" \
            --template-toggle-show "Mostrar contraseña" --template-toggle-hide "Ocultar contraseña"
          cd ..
          cp public/* dist/
          if grep -q '"title"' dist/index.html; then echo "::error::dist/index.html no está cifrado"; exit 1; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
